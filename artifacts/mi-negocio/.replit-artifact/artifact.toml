kind = "web"
previewPath = "/"
title = "Mi Negocio"
description = "MVP frontend para que pequeños comercios gestionen sucursales, empleados, productos, inventario y ventas con roles de demostración y datos ficticios locales."
version = "1.0.0"
id = "artifacts/mi-negocio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21142

[services.development]
run = "pnpm --filter @workspace/mi-negocio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mi-negocio", "run", "build" ]
serve = "static"
publicDir = "artifacts/mi-negocio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21142"
BASE_PATH = "/"
